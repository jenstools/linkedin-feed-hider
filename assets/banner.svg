<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a66c2"/>
      <stop offset="1" stop-color="#003a75"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#001a33" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <g opacity="0.08" fill="#fff">
    <circle cx="1080" cy="40" r="160"/>
    <circle cx="140" cy="380" r="120"/>
  </g>

  <text x="80" y="150" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#fff">LinkedIn Feed Hider</text>
  <text x="80" y="205" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="26" fill="#cfe3f7">Open LinkedIn for a reason, not for the scroll.</text>
  <g font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif" font-size="18" font-weight="600">
    <rect x="80" y="245" width="196" height="40" rx="20" fill="#fff" fill-opacity="0.15"/>
    <text x="178" y="271" text-anchor="middle" fill="#fff">Feed off by default</text>
    <rect x="290" y="245" width="176" height="40" rx="20" fill="#fff" fill-opacity="0.15"/>
    <text x="378" y="271" text-anchor="middle" fill="#fff">One-click toggle</text>
    <rect x="480" y="245" width="182" height="40" rx="20" fill="#fff" fill-opacity="0.15"/>
    <text x="571" y="271" text-anchor="middle" fill="#fff">Zero permissions</text>
  </g>

  <!-- Mini browser card -->
  <g transform="translate(790 60)" filter="url(#shadow)">
    <rect width="330" height="240" rx="14" fill="#f4f2ee"/>
    <rect width="330" height="34" rx="14" fill="#fff"/>
    <rect y="20" width="330" height="14" fill="#fff"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/><circle cx="36" cy="17" r="5" fill="#febc2e"/><circle cx="52" cy="17" r="5" fill="#28c840"/>
    <rect x="24" y="50" width="282" height="50" rx="8" fill="#fff"/>
    <circle cx="48" cy="75" r="13" fill="#c9d6e3"/>
    <rect x="70" y="64" width="220" height="22" rx="11" fill="none" stroke="#c4c4c4" stroke-width="1.5"/>
    <rect x="24" y="112" width="282" height="104" rx="8" fill="#fff"/>
    <rect x="95" y="134" width="140" height="10" rx="5" fill="#5e5e5e"/>
    <rect x="115" y="164" width="100" height="30" rx="15" fill="#0a66c2"/>
    <rect x="135" y="175" width="60" height="8" rx="4" fill="#fff"/>
  </g>
</svg>
