<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, sans-serif">
  <defs>
    <filter id="s" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.12"/>
    </filter>
    <linearGradient id="fadeout" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.6" stop-color="#f4f2ee" stop-opacity="0"/>
      <stop offset="1" stop-color="#f4f2ee" stop-opacity="1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f4f2ee"/>

  <!-- BEFORE -->
  <text x="300" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#8a8a8a" letter-spacing="3">BEFORE</text>
  <g transform="translate(80 80)" filter="url(#s)">
    <rect width="440" height="70" rx="10" fill="#fff"/>
    <circle cx="38" cy="35" r="18" fill="#c9d6e3"/>
    <rect x="68" y="20" width="350" height="30" rx="15" fill="none" stroke="#c4c4c4" stroke-width="1.5"/>
    <text x="86" y="41" font-size="15" fill="#666">Start a post</text>
  </g>
  <g filter="url(#s)">
    <g transform="translate(80 166)">
      <rect width="440" height="150" rx="10" fill="#fff"/>
      <circle cx="38" cy="36" r="18" fill="#e2c9b8"/>
      <rect x="66" y="24" width="140" height="10" rx="5" fill="#333"/>
      <rect x="66" y="42" width="90" height="8" rx="4" fill="#aaa"/>
      <rect x="20" y="70" width="400" height="8" rx="4" fill="#ccc"/>
      <rect x="20" y="88" width="360" height="8" rx="4" fill="#ccc"/>
      <rect x="20" y="106" width="380" height="8" rx="4" fill="#ccc"/>
      <text x="20" y="138" font-size="13" fill="#999">1,284 reactions  ·  312 comments  ·  97 reposts</text>
    </g>
    <g transform="translate(80 332)">
      <rect width="440" height="150" rx="10" fill="#fff"/>
      <circle cx="38" cy="36" r="18" fill="#c8e0c9"/>
      <rect x="66" y="24" width="120" height="10" rx="5" fill="#333"/>
      <rect x="66" y="42" width="110" height="8" rx="4" fill="#aaa"/>
      <rect x="20" y="70" width="390" height="8" rx="4" fill="#ccc"/>
      <rect x="20" y="88" width="400" height="8" rx="4" fill="#ccc"/>
    </g>
  </g>
  <rect x="60" y="380" width="480" height="120" fill="url(#fadeout)"/>
  <text x="300" y="500" text-anchor="middle" font-size="15" fill="#8a8a8a">…and it never ends</text>

  <!-- Arrow -->
  <g transform="translate(600 280)">
    <circle r="34" fill="#0a66c2"/>
    <path d="M-12 0 H12 M2 -10 L12 0 L2 10" stroke="#fff" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- AFTER -->
  <text x="900" y="56" text-anchor="middle" font-size="22" font-weight="700" fill="#0a66c2" letter-spacing="3">AFTER</text>
  <g transform="translate(680 80)" filter="url(#s)">
    <rect width="440" height="70" rx="10" fill="#fff"/>
    <circle cx="38" cy="35" r="18" fill="#c9d6e3"/>
    <rect x="68" y="20" width="350" height="30" rx="15" fill="none" stroke="#c4c4c4" stroke-width="1.5"/>
    <text x="86" y="41" font-size="15" fill="#666">Start a post</text>
  </g>
  <g transform="translate(680 166)" filter="url(#s)">
    <rect width="440" height="150" rx="10" fill="#fff"/>
    <text x="220" y="62" text-anchor="middle" font-size="19" font-weight="600" fill="#444">Feed hidden. Stay focused.</text>
    <rect x="150" y="84" width="140" height="40" rx="20" fill="#0a66c2"/>
    <text x="220" y="110" text-anchor="middle" font-size="16" font-weight="600" fill="#fff">Show feed</text>
  </g>
  <text x="900" y="370" text-anchor="middle" font-size="15" fill="#8a8a8a">Messages, notifications and post links still work.</text>
</svg>
